name: Weather Classification CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.10" }
      - run: pip install flake8 black isort
      - run: black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - run: pytest tests/ --cov=src --cov-report=xml -v

  train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt        # ✅ ray[serve] removed
      - name: Create Ray home directory
        run: sudo mkdir -p /home/ray && sudo chmod 777 /home/ray
      - name: Run training pipeline
        env:
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
          RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        run: python src/pipeline/workflow.py --skip-tuning
      - uses: actions/upload-artifact@v4
        with:
          name: weather-model
          path: models/

  deploy:
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - run: pip install --upgrade anyscale
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: weather-model
          path: models/
      - name: Deploy persistent service to Anyscale
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
        run: |
          anyscale service deploy \
            --name weather-classifier \
            --working-dir . \
            src.serving.serve:app